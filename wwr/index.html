<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | White Water Rafting</title>
    <meta name="description"
    content="Welcome to Wild Rapids Rafting Co. Explore our white water rafting trips and sign up for exclusive updates and adventure tips.">
    <meta name="author" content="Anderson Lima">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>   
  <header>
    <img src="images/logo.png" alt="White Water Rafting Logo" width="150">
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
   </header>
    <main>
       <div class="hero">
      <img src="images/hero.jpg" alt="Rafters going through white water rapids">
      <h1>Wild Rapids Rafting Co.</h1>
      <article class="cta">
        <h2>Ready to Ride the Rapids </h2>
        <a href="trips.html" class="cta-button">Explore Our Trips →</a>
      </article>
    </div>
      <section class="newsletter">
        <h2>Join Our Newsletter</h2>
        <form action="#" method="post" class="newsletter-form">
           <label for="name">Name</label>
           <input type="text" id="name" name="name" placeholder="Placeholder" required>

           <label for="email">Email</label>
           <input type="email" id="email" name="email" placeholder="Placeholder" required>
           <button type="submit" class="submit-btn">Sign Up!</button>
        </form>
      </section> 
    <section class="offers">
      <h2>What We Offer</h2>
      <figure>
      <p>Whether you're a first-time paddler or a seasoned adventurer, we offer trips for every skill level. From calm scenic floats perfect for families to thrilling rapids for the more daring, there's an adventure waiting for everyone.</p>
      <img src="images/offers-group.jpg" alt="Group of rafters paddling together on calm turquoise water">
      </figure>
     <figure>
      <p>Your safety is our top priority. Every trip includes top-quality life jackets, helmets, and professional guides trained to keep you safe while you focus on having the time of your life.</p>
      <img src="images/offers-equipment.jpg" alt="Life jackets and helmets ready for use on a rafting trip"> 
     </figure>
    </section>
  </main>
     <footer>
    <p>&copy; 2026 Wild Rapids Rafting Co. | Anderson Lima</p>
    <nav class="socialmedia">
      <a href="https://facebook.com" target="_blank"><img src="images/facebook.png"
          alt="Follow us on Facebook" width="30"></a>
      <a href="https://instagram.com" target="_blank"><img src="images/instagram.png"
          alt="Follow us on Instagram" width="30"></a>
      <a href="https://twitter.com" target="_blank"><img src="images/twitter.png"
          alt="Follow us on Twitter" width="30"></a>
    </nav>
  </footer>
</body>
</html>

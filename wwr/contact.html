<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | White Water Rafting</title>
<meta name="description"
  content="Get in touch with Wild Rapids Rafting Co. Find our address, phone number, email, and send us a message about bookings or general inquiries.">
  <meta name="author" content="Anderson Lima">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img src="images/logo.png" alt="White Water Rafting Logo" width="150">
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>
  <main>
    <section class="contact-header">
      <h1>White Water Rafting Company</h1>
      <address>
        <p>123 Main River Street</p>
        <p>Kolob, California</p>
        <p><a href="tel:+19999999999">+1 999 999 9999</a></p>
        <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
      </address>
    </section>

    <section class="contact-main">
      <h2 class="visually-hidden">Get in Touch</h2>
      <div class="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d199665.83802240685!2d-121.62655309002571!3d38.56191179387764!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809ac672b28397f9%3A0x921f6aaa74197fdb!2sSacramento%2C%20CA%2C%20EUA!5e0!3m2!1spt-PT!2sao!4v1785590292341!5m2!1spt-PT!2sao"
          width="600" height="450" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade" title="White Water Rafting Company location on Google Maps"></iframe>
      </div>

      <form action="#" method="post" class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Placeholder" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Placeholder" required>

        <fieldset>
          <legend>Message Purpose</legend>
          <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
          <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
          <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
        </fieldset>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Type here" required></textarea>

        <label class="checkbox-label">
          <input type="checkbox" id="newsletter" name="newsletter">
          Please subscribe me to the monthly newsletter
        </label>

        <button type="submit" class="submit-btn">Get in Touch!</button>
      </form>
    </section>

    <section class="team">
      <h2>We Are Here to Serve You</h2>
      <div class="team-grid">
<figure>
          <img src="images/guide1.jpg" alt="Photo of head guide">
          <figcaption>Robert Hale — Head Guide</figcaption>
        </figure>
        <figure>
          <img src="images/guide2.jpg" alt="Photo of operations manager">
          <figcaption>Daniel Cruz — Operations Manager</figcaption>
        </figure>
        <figure>
          <img src="images/guide3.jpg" alt="Photo of customer service lead">
          <figcaption>Maria Santos — Customer Service Lead</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Wild Rapids Rafting Co. | Anderson Lima</p>
    <nav class="socialmedia">
      <a href="https://facebook.com" target="_blank"><img src="images/facebook.png"
          alt="Follow us on Facebook" width="30"></a>
      <a href="https://instagram.com" target="_blank"><img src="images/instagram.png"
          alt="Follow us on Instagram" width="30"></a>
      <a href="https://twitter.com" target="_blank"><img src="images/twitter.png"
          alt="Follow us on Twitter" width="30"></a>
    </nav>
  </footer>
</body>

</html>
